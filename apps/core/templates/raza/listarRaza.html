{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h2>Confirmar eliminación</h2>

  <p>¿Estás seguro de que deseas eliminar la raza <strong>{{ raza.nombre }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'listar_razas' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
