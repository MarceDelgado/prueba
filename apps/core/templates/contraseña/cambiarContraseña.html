{% extends "base.html" %}
{% block content %}
    <div class="container py-5">
        <h1>Cambiar contraseña</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mt-3">
                <label for="password" class="form-check-label" >Nueva contraseña: </label>
                <input type="password" name="password" id="password" class="form-control" required>
            </div>
            <div class="mt-3">
                <label for="password2" class="form-check-label">Confirmar contraseña: </label>
                <input type="password" name="password2" id="password2" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar nueva contraseña</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
        </form>
        {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                    <div class="alet alert-info">{{message}}</div>
                {% endfor %}
            </div>
        {% endif %}

    </div>

{% endblock %}
