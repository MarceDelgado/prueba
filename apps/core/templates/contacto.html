<!-- Sección 2: Contacto + Mapa -->

    <div class="row">
        <!-- Formulario -->
        <div class="col-md-6 mb-4">
            <h2>Contáctanos</h2>
            <form method="post" action="#">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
        <!-- Mapa -->
        <div class="col-md-6">
            <h2>Ubicación</h2>
            <div class="ratio ratio-16x9">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d467.0422648668132!2d-65.102121!3d-43.299837!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9616f0b9b6c40715%3A0x58bdf019a9b3e3a2!2s25%20de%20Mayo%20550%2C%20Rawson%2C%20Chubut!5e0!3m2!1ses-419!2sar!4v1694100000000!5m2!1ses-419!2sar"
                    style="border:10px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </div>
