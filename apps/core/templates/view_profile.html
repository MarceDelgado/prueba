{% extends 'base.html' %}
{% block content %}

<div class="container mt-5 text-center">
    <h2>{{ request.user.username }}</h2>
    <img src="{{ profile.avatar.url }}" alt="Avatar" class="rounded-circle" width="150" height="150">
    <p>{{ profile.bio }}</p>
    <a href="{% url 'edit_profile' %}" class="btn btn-outline-primary"> Editar Perfil </a>
</div>

{% endblock %}
