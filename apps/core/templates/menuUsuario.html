{% load static %}

<div class="container py-5">
    <h2 class="mb-4 text-center">Mascotas Disponibles</h2>

    <!-- Acordeón de Mascotas -->
    <div class="accordion" id="accordionMascotas">
        {% for mascota in mascotas %}
            <div class="accordion-item">
                <h2 class="accordion-header" id="heading{{ mascota.id }}">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ mascota.id }}" aria-expanded="false" aria-controls="collapse{{ mascota.id }}">
                        {{ mascota.raza }} - {{ mascota.sexo }}
                    </button>
                </h2>
                <div id="collapse{{ mascota.id }}" class="accordion-collapse collapse" aria-labelledby="heading{{ mascota.id }}" data-bs-parent="#accordionMascotas">
                    <div class="accordion-body">
                        <strong>Especie:</strong> {{ mascota.raza.especie }}<br>
                        <strong>Fecha de nacimiento:</strong> {{ mascota.fecha_nac }}<br>
                        <strong>Observaciones:</strong> {{ mascota.observaciones }}<br>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="accordion-item">
                <div class="accordion-body text-center text-muted">
                    No hay mascotas disponibles.
                </div>
            </div>
        {% endfor %}
    </div>

</div>
