{% extends 'base.html' %}
{% load static %}

{% block title %}Lista de Especies{% endblock %}

{% block content %}
<div class="table-responsive py-4">
    <h2 class="mb-4 text-primary fw-bold">Lista de Especies</h2>
    <table class="table table-striped table-hover align-middle shadow-sm rounded-4">
        <thead class="table-primary">
            <tr>
                <th>Nombre de especie</th>
                <th>Opciones</th>
            </tr>
        </thead>
        <tbody>
            {% for especie in especies %}
            <tr>
                <td>{{ especie.nombre }}</td>
                <td class="d-flex gap-2">
                    <a href="{% url 'modificar_especie' especie.pk %}" class="btn btn-sm btn-primary">Modificar</a>
                    <a href="{% url 'eliminar_especie' especie.pk %}" class="btn btn-sm btn-danger">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center text-muted">No hay especies cargadas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<style>
.table thead th {
    border-top-left-radius: 0.5rem;
    border-top-right-radius: 0.5rem;
}
.table-hover tbody tr:hover {
    background-color: #e6f2ff;
    transition: background-color 0.3s ease;
}
.btn-sm {
    min-width: 90px;
}
</style>
{% endblock %}
