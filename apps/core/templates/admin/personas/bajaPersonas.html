{% extends "base.html" %}
{% block content %}
    <div class="form-container">
        <h1>Dar de baja a Adoptante</h1>
        <form method="post">
            {% csrf_token %}
            <h2>¿ESTÁS SEGURO DE QUERER DAR DE BAJA A ESTA PERSONA? </h2>
            <h2>"{{persona.nombre}}  {{ persona.apellido }}"</h2>
            <h3>~Si le da de baja, esta persona no estará habilitada para adoptar~</h3>
            <button type="submit"class="btn btn-primary">Dar de baja</button>
            <a href="{% url 'listar_personas' %}"class="btn btn-secondary"> Cancelar </a>
        </form>
    </div>
{% endblock %}
