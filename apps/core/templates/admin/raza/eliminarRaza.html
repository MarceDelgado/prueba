{% extends 'base.html'%}
{% block content %}
<div class="form-container" style="margin-top: 80px;">
	<h1> Eliminar raza</h1>
        <form method="post">
            {% csrf_token %}
            <h2>¿ESTÁS SEGURO DE QUERER ELIMINAR A ESTA RAZA? </h2>
            <h2>{{raza.nombre}}</h2>
            <button type="submit"class="btn btn-primary">Eliminar raza</button>
            <a href="{% url 'listar_razas' %}"class="btn btn-secondary"> Cancelar </a>
        </form>
    </div>
{%endblock %}
