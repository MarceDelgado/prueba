{% extends 'base.html' %}

{% block title %}Lista de Razas{% endblock %}

{% block content %}
<div class="table-responsive py-4">
    <h2 class="mb-4 text-primary fw-bold">Lista de Razas</h2>
    <table id="tablaUP" class="table table-striped table-hover align-middle shadow-sm rounded-4">
        <thead class="table-primary">
            <tr>
                <th>Nombre de Raza</th>
                <th>Tipo de Especie</th>
                <th>Opciones</th>
            </tr>
        </thead>
        <tbody>
            {% for raza in razas %}
            <tr>
                <td>{{ raza.nombre }}</td>
                <td>{{ raza.especie }}</td>
                <td class="d-flex gap-2">
                    <a href="{% url 'modificar_raza' raza.pk %}" class="btn btn-sm btn-primary">Modificar</a>
                    <a href="{% url 'eliminar_raza' raza.pk %}" class="btn btn-sm btn-danger">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center text-muted">No hay razas registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
