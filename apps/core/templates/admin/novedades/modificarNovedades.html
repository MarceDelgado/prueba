{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Modificar Novedad</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Actualizar</button>
    <a href="{% url 'listar_novedades' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
