{% extends "base.html" %}
{% block content %}


<form method="POST" style="margin-top: 80px;">

    <h2 class="mb-4 text-danger">Eliminar Novedad</h2>

    <p>¿Estás seguro que deseas eliminar la novedad <strong>"{{ novedad.titulo }}"</strong>?</p>

    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'listar_novedades' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
