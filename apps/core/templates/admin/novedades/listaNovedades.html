{% extends "base.html" %}
{% block content %}

<div class="table-responsive py-4" style="margin-top: 80px;">
    <h2 class="mb-4 text-primary fw-bold">Lista de novedades</h2>
    <table id="tablaUP" class="table table-striped table-hover align-middle shadow-sm rounded-4">
        <thead class="table-primary">   
            <tr>
                <th>Título</th>
                <th>Fecha</th>
                <th>Foto</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            {% for n in novedades %}
            <tr>
                <td>{{ n.titulo }}</td>
                <td>{{ n.fecha|date:"d/m/Y H:i" }}</td>
                <td>
                    {% if n.imagen %}
                    <img src="{{ n.imagen.url }}" class="img-thumbnail" style="max-width:120px; border-radius:8px;">
                    {% else %}
                    <span class="text-muted">Sin foto</span>
                    {% endif %}
                </td>
                <td>
                    <a href="{% url 'modificar_novedades' n.id %}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{% url 'eliminar_novedades' n.id %}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center">No hay novedades cargadas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
