{% extends "base.html" %}
{% block content %}

<form method="POST" enctype="multipart/form-data" style="margin-top: 80px;">
    <h2 class="mb-4">Crear Novedad</h2>

    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{% url 'listar_novedades' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
