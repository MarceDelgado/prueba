{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4">Editar Perfil 🐾</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary mt-3">Guardar Cambios</button>
    </form> <br>
        <!-- BOTON VOLVER ATRAS -->
    <div class="mb-4">
        <a href="{% url 'view_profile' %}" class="btn btn-outline-dark">← Volver al menú</a>
    </div>
</div>
{% endblock %}
