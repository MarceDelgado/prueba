{% load static %}

<div class="container my-5">

  <div class="card shadow-lg border-0 rounded-4 p-5 articulo-cute">

    <!-- LAYOUT DOS COLUMNAS -->
    <div class="two-columns">

      <!-- COLUMNA IZQUIERDA: IMAGEN SOLA -->
      <div class="left-image">
        {% if novedad.imagen %}
          <img src="{{ novedad.imagen.url }}" alt="{{ novedad.titulo }}" class="imagen-principal">
        {% else %}
          <img src="{% static 'imagenes/sin_foto.jpg' %}" alt="Sin imagen" class="imagen-principal">
        {% endif %}
      </div>

      <!-- ⭐ LÍNEA VERTICAL AÑADIDA ⭐ -->
      <div class="vertical-divider"></div>

      <!-- COLUMNA DERECHA: TODO EL CONTENIDO -->
      <div class="right-content">

        <h1 class="fw-bold titulo-cute">{{ novedad.titulo }}</h1>

        <p class="text-muted mb-3">🗓️ Publicado el {{ novedad.fecha|date:"d/m/Y" }}</p>

        <p class="lead desc-corta">{{ novedad.descripcion_corta }}</p>

        <hr class="my-4 separador">

        <div class="contenido-articulo">
            <p>{{ novedad.contenido|linebreaks }}</p>
        </div>

        <!-- BOTON -->
        <div class="btn-volver-container text-center">
          <a href="{% url 'listar_novedades_usuario' %}" class="btn-volver">
            ⬅ Volver a todas las novedades
          </a>
        </div>

      </div>
    </div> 
  </div>
</div>

<style>
/* FONDO GENERAL */
body {
    background:#3daee9;
    min-height: 100vh;
    font-family: "Poppins", "Nunito", sans-serif;
}

/* TARJETA */
.articulo-cute {
    background: #d4f9ffcc;
    backdrop-filter: blur(8px);
    padding: 35px;
    box-shadow: 0 10px 28px rgba(160, 224, 255, 0.35);

    min-height: 85vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* —— LAYOUT DOS COLUMNAS —— */
.two-columns {
    display: flex;
    gap: 30px;
    align-items: stretch;   /* ⭐ NUEVO: hace que la línea tome la altura completa */
}

.vertical-divider {
    width: 3px;
    background: #5cc0ff;
    border-radius: 10px;
    opacity: 0.9;
    height: auto;           /* ⭐ hace que la altura se estire */
}

/* IZQUIERDA */
.left-image {
    flex: 0 0 30%;
}

.imagen-principal {
    width: 100%;
    height: 350px;
    object-fit: cover;
}

/* DERECHA */
.right-content {
    flex: 1;
}

/* TÍTULO */
.titulo-cute {
    font-size: 2.2rem;
    color: #3daee9;
}

/* DESCRIPCIÓN CORTA */
.desc-corta {
    font-size: 1.1rem;
    color: #002f52;
    background: #9cdbfc;
    padding: 12px 18px;
    border-radius: 12px;
    border-left: 5px solid #5cc0ff;
    display: inline-block;
    font-weight: 700;
}

/* SEPARADOR */
.separador {
    border-top: 3px solid #5cc0ff;
}

/* CONTENIDO */
.contenido-articulo p {
    font-size: 1.1rem;
    line-height: 1.7;
    color: #000000;
    font-weight: 700;
}

/* BOTÓN */
.btn-volver {
    background-color: #5cc0ff;
    color: white !important;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 30px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(92, 192, 255, 0.4);
    transition: 0.3s ease;
}

.btn-volver:hover {
    background-color: #3daee9;
    transform: scale(1.05);
}

.btn-volver-container {
    margin-top: 40px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .two-columns {
        flex-direction: column;
    }

    .vertical-divider {
        display: none; /* línea desaparece en móvil */
    }

    .imagen-principal {
        height: 250px;
    }
}
</style>
